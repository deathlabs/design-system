---
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-lint:
    name: Code Lint Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            examples/web/package-lock.json

      - name: Install Dependencies
        run: make setup

      - name: Format the Source Code
        run: make format && git diff --exit-code

      - name: Check the Source Code for Lint
        run: make check

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: code-lint

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            examples/web/package-lock.json

      - name: Install Dependencies
        run: make setup

      - name: Run Unit Tests
        run: make test

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            examples/web/package-lock.json

      - name: Install Dependencies
        run: make setup

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Add Syft to PATH
        run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"

      - name: Generate SBOM
        run: make sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: design-system-sbom
          path: design-system-sbom.json
          if-no-files-found: error

  scan-sbom:
    name: Scan SBOM
    runs-on: ubuntu-latest
    needs: generate-sbom
    env:
      GRYPE_FAILURE_THRESHOLD: medium
      SBOM_PATH: design-system-sbom.json

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: design-system-sbom

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7.4.0

      - name: Add Grype to PATH
        run: echo "$(dirname '${{ steps.grype.outputs.cmd }}')" >> "$GITHUB_PATH"

      - name: Scan SBOM
        run: |
          grype db update
          grype sbom:"$SBOM_PATH" --fail-on "$GRYPE_FAILURE_THRESHOLD"
